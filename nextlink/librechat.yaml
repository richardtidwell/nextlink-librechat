  },
  "endpoints": {
    "custom": [
      {
        "name": "Nextlink",
        "apiKey": "${NEXTLINK_LIBRECHAT_KEY}",
        "baseURL": "http://127.0.0.1:3001/v1",
        "models": {
          "default": [
            "nextlink-auto"
          ],
          "fetch": false
        },
        "titleConvo": false,
        "modelDisplayLabel": "Nextlink",
        "iconURL": "/assets/nextlink/nextlink-icon.png",
        "headers": {
          "X-Nextlink-User": "{{LIBRECHAT_USER_ID}}",
          "X-Nextlink-Conversation": "{{LIBRECHAT_BODY_CONVERSATIONID}}"
        },
        "dropParams": [
          "user",
          "temperature",
          "top_p",
          "frequency_penalty",
          "presence_penalty",
          "max_tokens"
        ],
        "addParams": {
          "stream": true
        }
      }
    ]
  },
